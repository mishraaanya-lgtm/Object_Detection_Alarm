<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081c35"/><stop offset="1" stop-color="#123d5a"/></linearGradient><style>.t{font-family:Arial,sans-serif;fill:#f5f8fc}.muted{fill:#b6cadd;font-family:Arial,sans-serif}.card{fill:#ffffff;fill-opacity:.08;stroke:#ffffff;stroke-opacity:.18;stroke-width:2}.accent{fill:#57e0bd}</style></defs>
<rect width="1200" height="1600" fill="url(#bg)"/><circle cx="1080" cy="80" r="230" fill="#57e0bd" opacity=".12"/><circle cx="35" cy="1340" r="260" fill="#ffcb69" opacity=".08"/>
<text x="72" y="105" class="accent" font-size="28" font-weight="bold" letter-spacing="4">ARDUINO • PROXIMITY SAFETY</text><text x="72" y="190" class="t" font-size="68" font-weight="bold">OBJECT DETECTION</text><text x="72" y="270" class="t" font-size="68" font-weight="bold">ALARM</text><text x="75" y="325" class="muted" font-size="28">Ultrasonic sensing with instant visual and audible alerts</text>
<rect x="72" y="380" width="1056" height="250" rx="28" class="card"/><text x="112" y="440" class="accent" font-size="25" font-weight="bold">OBJECTIVE</text><text x="112" y="492" class="t" font-size="28">Detect a nearby object and alert when it enters the</text><text x="112" y="532" class="t" font-size="28">8 cm threshold zone using an LED and buzzer.</text><rect x="850" y="425" width="220" height="130" rx="22" fill="#ffcb69"/><text x="960" y="485" text-anchor="middle" fill="#11243a" font-family="Arial" font-size="24" font-weight="bold">ALERT AT</text><text x="960" y="535" text-anchor="middle" fill="#11243a" font-family="Arial" font-size="42" font-weight="bold">≤ 8 cm</text>
<text x="72" y="715" class="accent" font-size="25" font-weight="bold" letter-spacing="3">HOW IT WORKS</text><rect x="72" y="755" width="324" height="230" rx="24" class="card"/><text x="105" y="810" class="accent" font-size="24">01 · SENSE</text><text x="105" y="870" class="t" font-size="27">HC-SR04 sends</text><text x="105" y="910" class="t" font-size="27">an ultrasonic pulse</text><text x="105" y="950" class="t" font-size="27">and listens for echo.</text><rect x="438" y="755" width="324" height="230" rx="24" class="card"/><text x="471" y="810" class="accent" font-size="24">02 · MEASURE</text><text x="471" y="870" class="t" font-size="27">Arduino converts</text><text x="471" y="910" class="t" font-size="27">echo time into</text><text x="471" y="950" class="t" font-size="27">distance in cm.</text><rect x="804" y="755" width="324" height="230" rx="24" class="card"/><text x="837" y="810" class="accent" font-size="24">03 · ALERT</text><text x="837" y="870" class="t" font-size="27">At ≤ 8 cm, LED</text><text x="837" y="910" class="t" font-size="27">and active buzzer</text><text x="837" y="950" class="t" font-size="27">turn on together.</text>
<rect x="72" y="1040" width="1056" height="240" rx="28" class="card"/><text x="112" y="1100" class="accent" font-size="25" font-weight="bold">KEY COMPONENTS &amp; PIN MAP</text><text x="112" y="1160" class="t" font-size="25">Arduino Uno · HC-SR04 · Active buzzer · LED + 220 Ω resistor</text><text x="112" y="1210" class="muted" font-size="24">TRIG D13 ECHO D12 BUZZER D11 LED D10 Shared 5V/GND</text>
<rect x="72" y="1320" width="1056" height="190" rx="28" fill="#57e0bd"/><text x="112" y="1380" fill="#092438" font-family="Arial" font-size="24" font-weight="bold">OUTCOME</text><text x="112" y="1430" fill="#092438" font-family="Arial" font-size="28" font-weight="bold">A compact, adjustable proximity warning system.</text><text x="112" y="1475" fill="#092438" font-family="Arial" font-size="22">Live distance appears in Serial Monitor at 9600 baud · No dataset or libraries needed</text><text x="72" y="1560" class="muted" font-size="18">OBJECT DETECTION ALARM • Arduino project poster</text></svg>
